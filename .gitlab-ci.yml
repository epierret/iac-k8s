stages:
  - build
  - setup
  - expose
  - verification
  - file

deploy-nginx:
  stage: build
  image:
    name: bitnami/kubectl:latest
    entrypoint: [""]
  variables:
    KUBE_CONTEXT: pierretenrique/kubernetes-test:k3s-agent
  script:
    - kubectl config use-context "$KUBE_CONTEXT"
    - kubectl apply -f k8s/nginx.yaml --validate=false
    - kubectl get pods

setup-nginx:
  stage: setup
  image:
    name: alpine/k8s:1.29.2
    entrypoint: [""]
  variables:
    KUBE_CONTEXT: pierretenrique/kubernetes-test:k3s-agent
  script:
    - echo -e "disable:\n  - traefik" |  tee -a /etc/rancher/k3s/config.yaml
    - sudo systemctl restart k3s
    - cat /etc/rancher/k3s/config.yaml
    - kubectl config use-context "$KUBE_CONTEXT"
    - kubectl apply -f https://github.com/kubernetes-sigs/gateway-api/releases/download/v1.2.0/standard-install.yaml
    - helm install ngf oci://ghcr.io/nginxinc/charts/nginx-gateway-fabric --create-namespace -n nginx-gateway

expose-nginx:
  stage: expose
  image:
    name: bitnami/kubectl:latest
    entrypoint: [""]
  variables:
    KUBE_CONTEXT: pierretenrique/kubernetes-test:k3s-agent
  script:
    - kubectl config use-context "$KUBE_CONTEXT"
    - kubectl apply -f k8s/gateway.yaml
    - kubectl expose deployment nginx-ci --name ci-svc --port 80 --target-port 80
    - kubectl get gateway
    - kubectl get httproute

verification:
  stage: verification
  image: curlimages/curl:latest
  variables:
    NODE_IP: "192.168.1.48"
    NODE_PORT: "31325"
  script:
    - echo "Testing Gateway API routing..."
    - echo "Test reussi !"

pdf:
  stage: file
  image: curlimages/curl:latest
  variables:
    NODE_IP: "192.168.1.48"
    NODE_PORT: "31325"
  script:
    - echo "generating file..."
  artifacts:
    paths:
      - my_goal.txt